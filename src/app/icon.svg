<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7F1D1D" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  
  <!-- Outer squircle background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#brandGradient)" />
  
  <!-- Sleek metallic inner border stroke -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="url(#borderGlow)" stroke-width="12" />
  
  <!-- "SE" Monogram text -->
  <text 
    x="50%" 
    y="54%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    font-family="Montserrat, system-ui, -apple-system, sans-serif" 
    font-weight="900" 
    font-size="250" 
    letter-spacing="-12">SE</text>
</svg>
